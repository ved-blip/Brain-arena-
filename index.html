<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BrainArena — AI Knowledge Battleground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,800;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0F1E;--bg-elev:#141B33;--bg-glow:#1E2547;--ink:#F2EEE0;--ink-muted:#7A82A0;--gold:#FFD447;--coral:#FF4E64;--emerald:#4ADE80;--line:rgba(242,238,224,.08);--line-strong:rgba(242,238,224,.18);--display:'Fraunces',serif;--body:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 20% 0%,rgba(255,212,71,.08),transparent 60%),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(255,78,100,.06),transparent 60%);pointer-events:none;z-index:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px;position:relative;z-index:1}
.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:rgba(10,15,30,.72);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;cursor:pointer}
.brand-dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 20px var(--gold);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links button{font-size:14px;color:var(--ink-muted);transition:color .2s var(--ease)}
.nav-links button:hover{color:var(--ink)}
.nav-cta{padding:10px 18px;background:var(--gold);color:var(--bg)!important;border-radius:999px;font-weight:600;font-size:14px}
.nav-cta:hover{transform:translateY(-1px)}
@media(max-width:720px){.nav-links button:not(.nav-cta){display:none}}
.hero{padding:60px 0 40px;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:24px}
.eyebrow::before{content:'';width:24px;height:1px;background:var(--gold)}
.hero-title{font-family:var(--display);font-weight:300;font-size:clamp(44px,7.5vw,104px);line-height:.95;letter-spacing:-.03em;margin-bottom:24px;max-width:900px}
.hero-title em{font-style:italic;font-weight:900;background:linear-gradient(120deg,var(--gold),var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{font-size:18px;color:var(--ink-muted);max-width:560px;margin-bottom:36px}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 26px;border-radius:999px;font-weight:600;font-size:15px;transition:transform .2s var(--ease),background .2s var(--ease),border-color .2s var(--ease);border:none;cursor:pointer;text-align:center}
.btn-primary{background:var(--gold);color:var(--bg)}
.btn-primary:hover{background:#ffdf6a;transform:translateY(-2px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-ghost{border:1px solid var(--line-strong);color:var(--ink);background:transparent}
.btn-ghost:hover{border-color:var(--gold)}
.arena-card{margin-top:56px;background:linear-gradient(180deg,var(--bg-elev),var(--bg-glow));border:1px solid var(--line-strong);border-radius:24px;padding:36px;position:relative;overflow:hidden}
.arena-card::before{content:'';position:absolute;top:-50%;right:-20%;width:500px;height:500px;background:radial-gradient(circle,rgba(255,212,71,.15),transparent 60%);pointer-events:none}
.arena-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;position:relative;z-index:1;flex-wrap:wrap;gap:16px}
.arena-label{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);display:flex;align-items:center;gap:10px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 12px var(--coral);animation:pulse 1.6s ease-in-out infinite}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;position:relative;z-index:1}
.mode-card{padding:28px 24px;border-radius:18px;border:1px solid var(--line-strong);background:linear-gradient(160deg,rgba(20,27,51,.6),rgba(10,15,30,.6));cursor:pointer;transition:all .3s var(--ease);text-align:left;min-height:180px;display:flex;flex-direction:column;justify-content:space-between;color:inherit}
.mode-card:hover{transform:translateY(-4px);border-color:var(--gold)}
.mode-card:hover .mode-icon{transform:scale(1.1) rotate(-5deg)}
.mode-icon{font-size:40px;margin-bottom:14px;display:inline-block;transition:transform .3s var(--ease)}
.mode-name{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin-bottom:6px}
.mode-desc{font-size:13px;color:var(--ink-muted);margin-bottom:16px}
.mode-tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);align-self:flex-start;padding:4px 10px;border:1px solid var(--gold);border-radius:999px}
.wizard{max-width:820px;margin:0 auto;padding:40px 0}
.wizard-progress{display:flex;align-items:center;gap:12px;margin-bottom:24px;font-family:var(--mono);font-size:11px;color:var(--ink-muted);letter-spacing:.1em;text-transform:uppercase}
.wizard-progress-bar{flex:1;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.wizard-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--coral));transition:width .5s var(--ease)}
.wizard-back{color:var(--ink-muted);font-size:13px;padding:8px 14px;border:1px solid var(--line-strong);border-radius:999px;transition:all .2s var(--ease);display:inline-flex;align-items:center;gap:6px;margin-bottom:24px}
.wizard-back:hover{color:var(--ink);border-color:var(--gold)}
.wizard-question{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.5vw,44px);line-height:1.1;letter-spacing:-.02em;margin-bottom:12px}
.wizard-question em{font-style:italic;font-weight:800;color:var(--gold)}
.wizard-help{color:var(--ink-muted);font-size:15px;margin-bottom:32px}
.chip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.chip{padding:18px 20px;background:rgba(242,238,224,.03);border:1px solid var(--line-strong);border-radius:14px;text-align:left;font-size:14px;font-weight:500;transition:all .2s var(--ease);cursor:pointer;display:flex;align-items:center;gap:12px;color:inherit}
.chip:hover{background:rgba(255,212,71,.08);border-color:var(--gold);transform:translateY(-2px)}
.chip.selected{background:rgba(255,212,71,.12);border-color:var(--gold);color:var(--gold)}
.chip-emoji{font-size:22px}
.chip-check{margin-left:auto;color:var(--gold);opacity:0;transition:opacity .2s var(--ease)}
.chip.selected .chip-check{opacity:1}
.custom-input{width:100%;padding:16px 20px;background:rgba(242,238,224,.03);border:1px solid var(--line-strong);border-radius:14px;color:var(--ink);font-size:15px;margin-bottom:12px}
.custom-input:focus{outline:none;border-color:var(--gold)}
.custom-input::placeholder{color:var(--ink-muted)}
.slider-row{background:rgba(242,238,224,.03);border:1px solid var(--line-strong);border-radius:16px;padding:24px;margin-bottom:20px}
.slider-value{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;color:var(--gold);letter-spacing:-.03em;margin-bottom:6px}
.slider-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:18px}
.slider{width:100%;-webkit-appearance:none;appearance:none;height:6px;background:var(--line-strong);border-radius:3px;outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;background:var(--gold);border-radius:50%;cursor:pointer;box-shadow:0 0 16px rgba(255,212,71,.5)}
.slider::-moz-range-thumb{width:24px;height:24px;background:var(--gold);border-radius:50%;cursor:pointer;border:none;box-shadow:0 0 16px rgba(255,212,71,.5)}
.confirm-card{background:linear-gradient(180deg,var(--bg-elev),var(--bg-glow));border:1px solid var(--line-strong);border-radius:20px;padding:32px;margin-bottom:20px}
.confirm-row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap;gap:8px}
.confirm-row:last-child{border-bottom:none}
.confirm-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.confirm-value{font-family:var(--display);font-weight:600;font-size:18px;color:var(--gold)}
.loading-screen{padding:100px 0;text-align:center}
.loading-orb{width:72px;height:72px;margin:0 auto 28px;position:relative}
.loading-orb::before,.loading-orb::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--gold);animation:spin 1.2s linear infinite}
.loading-orb::after{border-top-color:var(--coral);animation-duration:1.8s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-family:var(--display);font-size:26px;font-weight:400;margin-bottom:8px}
.loading-sub{color:var(--ink-muted);font-size:13px;font-family:var(--mono);letter-spacing:.1em}
.quiz-shell{max-width:900px;margin:0 auto;padding:32px 0}
.quiz-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.quiz-progress{flex:1;min-width:200px}
.quiz-progress-label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink-muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.quiz-progress-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--coral));transition:width .4s var(--ease)}
.quiz-stats{display:flex;gap:10px;font-family:var(--mono);font-size:12px;flex-wrap:wrap}
.quiz-stat{display:flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(242,238,224,.03);border:1px solid var(--line);border-radius:999px}
.quiz-stat-value{color:var(--gold);font-weight:700}
.quiz-card{background:linear-gradient(180deg,var(--bg-elev),var(--bg-glow));border:1px solid var(--line-strong);border-radius:24px;padding:36px;margin-bottom:20px;position:relative;overflow:hidden}
.quiz-card::before{content:'';position:absolute;top:-50%;right:-20%;width:500px;height:500px;background:radial-gradient(circle,rgba(255,212,71,.08),transparent 60%);pointer-events:none}
.q-number{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;position:relative}
.q-text{font-family:var(--display);font-weight:400;font-size:clamp(20px,3vw,30px);line-height:1.3;margin-bottom:28px;position:relative}
.q-options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;position:relative}
@media(max-width:620px){.q-options{grid-template-columns:1fr}.quiz-card{padding:26px 22px}}
.q-option{padding:16px 18px;background:rgba(242,238,224,.04);border:1px solid var(--line-strong);border-radius:14px;text-align:left;display:flex;align-items:center;gap:14px;transition:all .2s var(--ease);font-size:14px;cursor:pointer;color:inherit}
.q-option:hover:not(.locked){background:rgba(255,212,71,.08);border-color:var(--gold);transform:translateY(-1px)}
.q-option.selected{background:rgba(255,212,71,.12);border-color:var(--gold)}
.q-option.locked{cursor:default}
.q-option-letter{width:30px;height:30px;border-radius:8px;background:rgba(242,238,224,.08);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--gold);flex-shrink:0}
.q-option.selected .q-option-letter{background:var(--gold);color:var(--bg)}
.q-option.correct{background:rgba(74,222,128,.15);border-color:var(--emerald)}
.q-option.correct .q-option-letter{background:var(--emerald);color:var(--bg)}
.q-option.wrong{background:rgba(255,78,100,.15);border-color:var(--coral)}
.q-option.wrong .q-option-letter{background:var(--coral);color:var(--bg)}
.feedback{background:linear-gradient(180deg,var(--bg-elev),var(--bg));border:1px solid var(--line-strong);border-radius:16px;padding:22px;margin-bottom:16px;animation:slideUp .4s var(--ease)}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.feedback-verdict{font-family:var(--display);font-weight:800;font-size:22px;margin-bottom:8px}
.feedback-verdict.correct{color:var(--emerald)}
.feedback-verdict.wrong{color:var(--coral)}
.feedback-explanation{color:var(--ink-muted);font-size:14px;line-height:1.6}
.quiz-actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.results-hero{text-align:center;padding:40px 0 30px}
.results-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding:8px 16px;border:1px solid var(--gold);border-radius:999px;margin-bottom:20px}
.results-title{font-family:var(--display);font-weight:300;font-size:clamp(38px,6.5vw,80px);line-height:.95;letter-spacing:-.03em;margin-bottom:12px}
.results-title em{font-style:italic;font-weight:900;background:linear-gradient(120deg,var(--gold),var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}
.results-score-huge{font-family:var(--display);font-weight:900;font-size:clamp(72px,13vw,160px);line-height:1;letter-spacing:-.04em;background:linear-gradient(120deg,var(--gold),var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent;margin:16px 0}
.results-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:32px}
.result-tile{padding:22px;background:linear-gradient(160deg,var(--bg-elev),var(--bg));border:1px solid var(--line-strong);border-radius:16px}
.result-tile-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:8px}
.result-tile-value{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;letter-spacing:-.02em;color:var(--gold)}
.result-tile-value.emerald{color:var(--emerald)}
.result-tile-value.coral{color:var(--coral)}
.results-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:32px}
.review-item{background:linear-gradient(160deg,var(--bg-elev),var(--bg));border:1px solid var(--line-strong);border-radius:16px;padding:22px;margin-bottom:14px}
.review-q-num{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--gold);margin-bottom:10px}
.review-q{font-family:var(--display);font-weight:500;font-size:18px;margin-bottom:14px;line-height:1.3}
.review-a{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.review-a.your{background:rgba(255,78,100,.1);border:1px solid rgba(255,78,100,.3);color:var(--coral)}
.review-a.your.match{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.3);color:var(--emerald)}
.review-a.correct{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:var(--emerald)}
.review-explanation{color:var(--ink-muted);font-size:13px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.lesson-path{display:grid;gap:10px;margin-bottom:28px}
.lesson-node{display:flex;align-items:center;gap:18px;padding:18px 20px;background:rgba(242,238,224,.03);border:1px solid var(--line-strong);border-radius:14px;cursor:pointer;transition:all .2s var(--ease)}
.lesson-node:hover{border-color:var(--gold);transform:translateX(4px)}
.lesson-node.completed{opacity:.6}
.lesson-node.current{border-color:var(--gold);background:rgba(255,212,71,.06)}
.lesson-num{width:40px;height:40px;border-radius:10px;background:var(--bg-elev);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;color:var(--gold);flex-shrink:0;font-size:13px}
.lesson-node.completed .lesson-num{background:var(--emerald);color:var(--bg)}
.lesson-body{flex:1;min-width:0}
.lesson-title{font-family:var(--display);font-weight:600;font-size:16px;margin-bottom:2px}
.lesson-desc{font-size:12px;color:var(--ink-muted)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}
.fade-in{animation:fadeIn .4s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.footer{padding:32px 0 28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-top:40px}
.footer-brand{font-family:var(--display);font-weight:800;font-size:18px}
.footer-meta{font-family:var(--mono);font-size:12px;color:var(--ink-muted)}
.footer-meta span{color:var(--gold)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg-elev);border:1px solid var(--gold);color:var(--ink);padding:14px 24px;border-radius:999px;font-size:14px;z-index:100;animation:toastIn .3s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<nav class="nav">
  <div class="wrap nav-inner">
    <a class="brand" onclick="goHome()"><span class="brand-dot"></span>BrainArena</a>
    <div class="nav-links">
      <button onclick="goHome()">Home</button>
      <button onclick="startBattleground()">Modes</button>
      <button class="nav-cta" onclick="startBattleground()">Enter Battleground →</button>
    </div>
  </div>
</nav>
<main id="app" class="wrap"></main>
<footer class="wrap">
  <div class="footer">
    <div class="footer-brand">BrainArena</div>
    <div class="footer-meta">Made by <span>Vedang Maheswari</span> · © 2026</div>
  </div>
</footer>
<script>
const app = {
  screen:'home', history:[],
  config:{ mode:null, board:null, grade:null, subject:null, subjectName:null, englishBranch:null, topic:null, topics:null, multiSelectMode:false, difficulty:'adaptive', count:10, level:null },
  quiz:{ questions:[], current:0, answers:[], score:0, streak:0, bestStreak:0, startTime:0, endTime:0, selected:null, submitted:false },
  learn:{ path:[], currentLesson:0 }
};
const $app = document.getElementById('app');
function nav(screen, opts={}) { if (opts.push!==false) app.history.push(app.screen); app.screen=screen; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function goBack() { if (app.history.length>0){ app.screen=app.history.pop(); render(); window.scrollTo({top:0,behavior:'smooth'});} else goHome(); }
function goHome() { app.screen='home'; app.history=[]; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function startBattleground() {
  app.config = { mode:null, board:null, grade:null, subject:null, subjectName:null, englishBranch:null, topic:null, topics:null, multiSelectMode:false, difficulty:'adaptive', count:10, level:null };
  nav('mode-select');
}
function toast(msg) { const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function esc(s) { if(s==null)return''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const MODES = [
  { id:'study', icon:'📚', name:'Study', tagline:'Structured practice by board, grade & subject.', tag:'Curriculum' },
  { id:'play', icon:'🎮', name:'Play', tagline:'Fast, fun quizzes on any topic.', tag:'Casual' },
  { id:'learn', icon:'🧠', name:'Learn', tagline:'Guided lessons before the quiz.', tag:'Lessons' },
  { id:'challenge', icon:'⚔️', name:'Challenge', tagline:'Timed combat. Streaks. XP. No mercy.', tag:'Competitive' },
  { id:'practice', icon:'🎯', name:'Practice', tagline:"Drill weak spots until they aren't weak.", tag:'Repetition' }
];
const BOARDS = [
  {id:'cbse',icon:'🇮🇳',name:'CBSE'},{id:'icse',icon:'📘',name:'ICSE'},

async function generateQuestions(params) {
  const { board, subject, topic, topics, grade, difficulty, count } = params;
  const topicStr = (topics&&topics.length>1) ? `a mix of these topics: ${topics.join(', ')}` : `"${topic}"`;
  const prompt = `Generate exactly ${count} multiple-choice questions about ${topicStr}${subject?` in ${subject}`:''}${grade?` for grade ${grade} students`:''}${board?` following the ${board} board syllabus`:''}. Difficulty: ${difficulty}.
${(topics&&topics.length>1)?`IMPORTANT: distribute the ${count} questions roughly evenly across these topics: ${topics.join(', ')}. Each question must clearly belong to ONE of these topics.`:''}
${board?`IMPORTANT: questions must match the ${board} Grade ${grade} syllabus scope — no advanced concepts outside this grade level.`:''}

Return ONLY a valid JSON array. No markdown, no code fences, no preamble.
[{"question":"Text?","options":["A","B","C","D"],"correctAnswer":0,"explanation":"One sentence."}]

Rules: correctAnswer is 0-3 index. 4 options each. Factually accurate. Age-appropriate. Vary correct answer positions. No duplicates.`;
  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:Math.min(8000,400*count), messages:[{role:"user",content:prompt}] })
    });
    if(!response.ok) throw new Error('api '+response.status);
    const data = await response.json();
    let text = data.content.filter(c=>c.type==='text').map(c=>c.text).join('\n').trim();
    text = text.replace(/^```json\s*|\s*```$/g,'').replace(/^```\s*|\s*```$/g,'').trim();
    const start = text.indexOf('['), end = text.lastIndexOf(']');
    if(start===-1||end===-1) throw new Error('no array');
    const arr = JSON.parse(text.slice(start,end+1));
    return arr.filter(q=>q&&typeof q.question==='string'&&Array.isArray(q.options)&&q.options.length===4&&typeof q.correctAnswer==='number'&&q.correctAnswer>=0&&q.correctAnswer<=3);
  } catch(e) { console.warn('AI failed:',e.message); return null; }
}

function getFallbackQuestions(config) {
  const topicList = (config.topics&&config.topics.length?config.topics:[config.topic||'']).map(t=>t.toLowerCase().trim()).filter(Boolean);
  const combinedTopic = topicList.join(' ');
  const subject = (config.subjectName||'').toLowerCase();
  let pool = [];
  if (combinedTopic.includes('cricket')) pool=FALLBACK_BANK.cricket;
  else if (combinedTopic.includes('football')||combinedTopic.includes('soccer')) pool=FALLBACK_BANK.football;
  else if (combinedTopic.includes('gaming')||combinedTopic.includes('roblox')||combinedTopic.includes('blox')||combinedTopic.includes('minecraft')) pool=FALLBACK_BANK.gaming;
  else if (combinedTopic.includes('tech')||subject.includes('computer')) pool=FALLBACK_BANK.tech;
  else if (combinedTopic.includes('history')) pool=FALLBACK_BANK.history;
  else if (subject.includes('math')||['fraction','algebra','geometry','percentage','ratio','decimal','integer','equation','probability'].some(k=>combinedTopic.includes(k))) pool=FALLBACK_BANK.math;
  else if (subject.includes('science')||['physics','chemistry','biology','astronomy','motion','energy','cell'].some(k=>combinedTopic.includes(k))) pool=FALLBACK_BANK.science;
  else if (subject.includes('english')||combinedTopic.includes('grammar')) pool=FALLBACK_BANK.english;
  else pool=FALLBACK_BANK.gk;

  const filtered = pool.filter(q=>{ if(!q.topic)return false; const qt=q.topic.toLowerCase(); return topicList.some(t=>qt.includes(t)||t.includes(qt)); });
  let source;
  if(filtered.length>=config.count) source=filtered;
  else if(filtered.length>0){ const rest=pool.filter(q=>!filtered.includes(q)); source=[...filtered,...rest]; }
  else source=pool;

  const shuffled = [...source].sort(()=>Math.random()-0.5);
  const result = shuffled.slice(0, Math.min(config.count, shuffled.length));
  if(result.length<config.count){ const extra=[...FALLBACK_BANK.gk].sort(()=>Math.random()-0.5); while(result.length<config.count&&extra.length>0) result.push(extra.shift()); }
  return result;
}

function renderQuiz() {
  const q = app.quiz.questions[app.quiz.current];
  if(!q){finishQuiz();return;}
  const total = app.quiz.questions.length;
  const pct = (app.quiz.current/total)*100;
  const letters = ['A','B','C','D'];
  $app.innerHTML = `<div class="quiz-shell"><div class="quiz-topbar"><div class="quiz-progress"><div class="quiz-progress-label"><span>Question ${app.quiz.current+1} / ${total}</span><span>${Math.round(pct)}%</span></div><div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pct}%"></div></div></div><div class="quiz-stats"><div class="quiz-stat">🎯 Score <span class="quiz-stat-value">${app.quiz.score}</span></div><div class="quiz-stat">🔥 Streak <span class="quiz-stat-value">${app.quiz.streak}</span></div></div></div><div class="quiz-card"><div class="q-number">Question ${app.quiz.current+1} of ${total}</div><div class="q-text">${esc(q.question)}</div><div class="q-options">${q.options.map((opt,i)=>`<button class="q-option" data-idx="${i}" onclick="selectAnswer(${i})"><span class="q-option-letter">${letters[i]}</span><span>${esc(opt)}</span></button>`).join('')}</div></div><div id="feedbackSlot"></div><div class="quiz-actions"><button class="btn btn-ghost" onclick="quitQuiz()">Quit</button><button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>Submit Answer <span>→</span></button></div></div>`;
}

function selectAnswer(idx) {
  if(app.quiz.submitted)return;
  app.quiz.selected=idx;
  document.querySelectorAll('.q-option').forEach(el=>el.classList.remove('selected'));
  document.querySelector(`.q-option[data-idx="${idx}"]`).classList.add('selected');
  document.getElementById('submitBtn').disabled=false;
}

function submitAnswer() {
  if(app.quiz.submitted||app.quiz.selected===null)return;
  app.quiz.submitted=true;
  const q = app.quiz.questions[app.quiz.current];
  const chosen = app.quiz.selected;
  const isCorrect = chosen===q.correctAnswer;
  app.quiz.answers.push({question:q.question,options:q.options,chosen,correct:q.correctAnswer,isCorrect,explanation:q.explanation});
  if(isCorrect){ app.quiz.score++; app.quiz.streak++; if(app.quiz.streak>app.quiz.bestStreak) app.quiz.bestStreak=app.quiz.streak; }
  else app.quiz.streak=0;
  document.querySelectorAll('.q-option').forEach(el=>{
    el.classList.add('locked');
    const idx=parseInt(el.dataset.idx);
    if(idx===q.correctAnswer) el.classList.add('correct');
    else if(idx===chosen) el.classList.add('wrong');
    el.classList.remove('selected');
  });
  document.getElementById('feedbackSlot').innerHTML = `<div class="feedback"><div class="feedback-verdict ${isCorrect?'correct':'wrong'}">${isCorrect?'✓ Correct':'✗ Not quite'}</div><div class="feedback-explanation">${esc(q.explanation||'Keep going.')}</div></div>`;
  const btn = document.getElementById('submitBtn');
  const isLast = app.quiz.current===app.quiz.questions.length-1;
  btn.innerHTML = isLast ? 'See Results <span>→</span>' : 'Next Question <span>→</span>';
  btn.onclick = nextQuestion; btn.disabled=false;
}

function nextQuestion() {
  if(app.quiz.current>=app.quiz.questions.length-1){finishQuiz();return;}
  app.quiz.current++; app.quiz.selected=null; app.quiz.submitted=false; renderQuiz();
}

function finishQuiz() { app.quiz.endTime=Date.now(); nav('results',{push:false}); }

function quitQuiz() {
  const existing = document.getElementById('quitModal'); if(existing) existing.remove();
  const m = document.createElement('div'); m.id='quitModal';
  m.style.cssText = 'position:fixed;inset:0;background:rgba(10,15,30,.88);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)';
  m.innerHTML = `<div style="background:linear-gradient(180deg,var(--bg-elev),var(--bg-glow));border:1px solid var(--line-strong);border-radius:20px;padding:32px;max-width:420px;width:100%;text-align:center"><div style="font-size:44px;margin-bottom:12px">⚔️</div><h3 style="font-family:var(--display);font-weight:800;font-size:26px;margin-bottom:8px">Quit the round?</h3><p style="color:var(--ink-muted);margin-bottom:24px;font-size:15px">Your progress will be lost.</p><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="btn btn-ghost" onclick="closeQuitModal()">Cancel</button><button class="btn btn-primary" onclick="closeQuitModal(); goHome()">Yes, quit</button></div></div>`;
  document.body.appendChild(m);
  m.addEventListener('click',(e)=>{ if(e.target===m) closeQuitModal(); });
}
function closeQuitModal() { const m=document.getElementById('quitModal'); if(m)m.remove(); }

function renderResults() {
  const q = app.quiz;
  const total = q.questions.length, correct = q.score, incorrect = total-correct;
  const accuracy = Math.round((correct/total)*100);
  const seconds = Math.round((q.endTime-q.startTime)/1000);

  const xp = correct*10 + q.bestStreak*5;
  const perfect = accuracy===100;
  $app.innerHTML = `<div class="wizard"><div class="results-hero"><div class="results-badge">${perfect?'⚔️ FLAWLESS VICTORY':'⚔️ BATTLEGROUND COMPLETE'}</div><h1 class="results-title">${perfect?"You didn't miss.":'The round is <em>done.</em>'}</h1><div class="results-score-huge">${correct}/${total}</div><p style="color:var(--ink-muted);font-size:17px">${accuracy}% accuracy · ${xp} XP earned</p></div><div class="results-grid"><div class="result-tile"><div class="result-tile-label">Correct</div><div class="result-tile-value emerald">${correct}</div></div><div class="result-tile"><div class="result-tile-label">Incorrect</div><div class="result-tile-value coral">${incorrect}</div></div><div class="result-tile"><div class="result-tile-label">Accuracy</div><div class="result-tile-value">${accuracy}%</div></div><div class="result-tile"><div class="result-tile-label">Best Streak</div><div class="result-tile-value">🔥 ${q.bestStreak}</div></div><div class="result-tile"><div class="result-tile-label">Time</div><div class="result-tile-value">${mins}:${String(secs).padStart(2,'0')}</div></div><div class="result-tile"><div class="result-tile-label">XP</div><div class="result-tile-value">+${xp}</div></div><div class="result-tile"><div class="result-tile-label">Topic</div><div class="result-tile-value" style="font-size:18px">${esc(app.config.topic||'—')}</div></div><div class="result-tile"><div class="result-tile-label">Difficulty</div><div class="result-tile-value" style="font-size:18px;text-transform:capitalize">${app.config.difficulty}</div></div></div><div class="results-actions"><button class="btn btn-primary" onclick="tryAgain()">🔄 Try Again</button><button class="btn btn-ghost" onclick="nav('review')">📖 Review Answers</button><button class="btn btn-ghost" onclick="learnWeakTopics()">🧠 Learn Weak Topics</button><button class="btn btn-ghost" onclick="startBattleground()">➕ New Quiz</button><button class="btn btn-ghost" onclick="goHome()">🏠 Home</button></div></div>`;

function renderLearnPath() {
  const t = app.config.topic;
  $app.innerHTML = `<div class="wizard"><button class="wizard-back" onclick="goBack()">← Back</button><h1 class="wizard-question">Your path: <em>${esc(t)}</em></h1><p class="wizard-help">8 lessons for ${app.config.level} level.</p><div class="lesson-path">${app.learn.path.map((l,i)=>`<div class="lesson-node ${i<app.learn.currentLesson?'completed':''} ${i===app.learn.currentLesson?'current':''}" onclick="openLesson(${i})"><div class="lesson-num">${i<app.learn.currentLesson?'✓':String(i+1).padStart(2,'0')}</div><div class="lesson-body"><div class="lesson-title">${esc(l.title)}</div><div class="lesson-desc">${esc(l.desc)}</div></div><span style="color:var(--gold)">→</span></div>`).join('')}</div><button class="btn btn-primary" onclick="startLearnQuiz()">Skip to Final Quiz <span>⚔️</span></button></div>`;
}

function openLesson(idx) { app.learn.currentLesson=idx; nav('learn-lesson'); }

function renderLearnLesson() {
  const lesson = app.learn.path[app.learn.currentLesson];
  const idx = app.learn.currentLesson, total = app.learn.path.length;
  const isLast = idx===total-1;
  $app.innerHTML = `<div class="wizard"><button class="wizard-back" onclick="nav('learn-path')">← Back to path</button><div class="wizard-progress"><span>Lesson ${idx+1} of ${total}</span><div class="wizard-progress-bar"><div class="wizard-progress-fill" style="width:${((idx+1)/total)*100}%"></div></div><span>${esc(app.config.topic)}</span></div><h1 class="wizard-question">${esc(lesson.title)}</h1><p class="wizard-help">${esc(lesson.desc)}</p><div class="confirm-card"><p style="font-size:16px;line-height:1.7">This lesson covers <strong style="color:var(--gold)">${esc(lesson.title.toLowerCase())}</strong> for <strong style="color:var(--gold)">${esc(app.config.topic)}</strong> at <strong style="color:var(--gold)">${app.config.level}</strong> level.</p><p style="margin-top:16px;color:var(--ink-muted);font-size:15px;line-height:1.7">Read through, then continue. The final lesson launches a live quiz.</p></div><div style="display:flex;gap:12px;flex-wrap:wrap">${idx>0?`<button class="btn btn-ghost" onclick="app.learn.currentLesson--; render()">← Previous</button>`:''}${!isLast?`<button class="btn btn-primary" onclick="app.learn.currentLesson++; render()">Continue <span>→</span></button>`:`<button class="btn btn-primary" onclick="startLearnQuiz()">Take the Final Quiz <span>⚔️</span></button>`}</div></div>`;
}

function startLearnQuiz() {
  app.config.mode='play'; app.config.count=5;
  app.config.difficulty = app.config.level==='beginner'?'easy':app.config.level==='advanced'?'hard':'medium';
  startQuiz();
}

render();

document.addEventListener('keydown',(e)=>{
  if(app.screen!=='quiz')return;
  const map={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3,'A':0,'B':1,'C':2,'D':3};
  if(map[e.key]!==undefined&&!app.quiz.submitted) selectAnswer(map[e.key]);
  else if(e.key==='Enter'){ if(!app.quiz.submitted&&app.quiz.selected!==null) submitAnswer(); else if(app.quiz.submitted) nextQuestion(); }
});
</script>
</body>
</html>
